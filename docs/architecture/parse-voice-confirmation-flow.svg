<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><title>Voice and confirmation flow</title><rect width="100%" height="100%" fill="#F8FAFD"/>
<polyline points="370,315 430,315" fill="none" stroke="#1769D2" stroke-width="2"/>
<polygon points="430,315 419.0,310.0 419.0,320.0" fill="#1769D2"/>
<polyline points="740,315 800,315" fill="none" stroke="#1769D2" stroke-width="2"/>
<polygon points="800,315 789.0,310.0 789.0,320.0" fill="#1769D2"/>
<polyline points="1110,315 1170,315" fill="none" stroke="#1769D2" stroke-width="2"/>
<polygon points="1170,315 1159.0,310.0 1159.0,320.0" fill="#1769D2"/>
<polyline points="1325,395 1325,520" fill="none" stroke="#147D75" stroke-width="2"/>
<polygon points="1325,520 1330.0,509.0 1320.0,509.0" fill="#147D75"/>
<polyline points="1170,600 1110,600" fill="none" stroke="#147D75" stroke-width="2"/>
<polygon points="1110,600 1121.0,605.0 1121.0,595.0" fill="#147D75"/>
<polyline points="800,600 740,600" fill="none" stroke="#147D75" stroke-width="2"/>
<polygon points="740,600 751.0,605.0 751.0,595.0" fill="#147D75"/>
<polyline points="430,600 370,600" fill="none" stroke="#147D75" stroke-width="2"/>
<polygon points="370,600 381.0,605.0 381.0,595.0" fill="#147D75"/>
<text x="60" y="70.6" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#172D44">Parse | From voice to a confirmed care record</text>
<text x="60" y="134.6" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#172D44">Backend logic owns validation, read-back and persistence; clients provide explicit review and confirmation</text>
<rect x="60" y="235" width="310" height="160" rx="12" fill="#EAF2FE" stroke="#A6C6F3" stroke-width="1.4"/>
<text x="80" y="270.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">1  Deliberate recording</text>
<text x="80" y="301.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Browser / native / cardholder</text>
<text x="80" y="327.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Short recording + retry identity</text>
<text x="80" y="353.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">User sends captured audio</text>
<rect x="430" y="235" width="310" height="160" rx="12" fill="#EAF2FE" stroke="#A6C6F3" stroke-width="1.4"/>
<text x="450" y="270.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">2  Accept + normalize</text>
<text x="450" y="301.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Authenticate installation</text>
<text x="450" y="327.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Persist idempotent turn receipt</text>
<text x="450" y="353.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Canonical 16 kHz PCM WAV</text>
<rect x="800" y="235" width="310" height="160" rx="12" fill="#F1EDFA" stroke="#C6B5E3" stroke-width="1.4"/>
<text x="820" y="270.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">3  Speech recognition</text>
<text x="820" y="301.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Tencent Cloud ASR</text>
<text x="820" y="327.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">WAV → transcript</text>
<text x="820" y="353.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Delete raw input after ASR</text>
<rect x="1170" y="235" width="310" height="160" rx="12" fill="#F1EDFA" stroke="#C6B5E3" stroke-width="1.4"/>
<text x="1190" y="270.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">4  Interpret intent</text>
<text x="1190" y="301.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Configured LLM endpoint</text>
<text x="1190" y="327.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Transcript + scoped care context</text>
<text x="1190" y="353.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Structured JSON proposal</text>
<rect x="1170" y="520" width="310" height="160" rx="12" fill="#E8F5F2" stroke="#9BCDC6" stroke-width="1.4"/>
<text x="1190" y="555.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">5  Validate + propose</text>
<text x="1190" y="586.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Backend schema / domain checks</text>
<text x="1190" y="612.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Snapshot + expiry + context ID</text>
<text x="1190" y="638.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Deterministic read-back text</text>
<rect x="800" y="520" width="310" height="160" rx="12" fill="#EAF2FE" stroke="#A6C6F3" stroke-width="1.4"/>
<text x="820" y="555.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">6  Read-back + review</text>
<text x="820" y="586.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Tencent TTS → bounded WAVs</text>
<text x="820" y="612.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Client shows / plays proposal</text>
<text x="820" y="638.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Correct or cancel before saving</text>
<rect x="430" y="520" width="310" height="160" rx="12" fill="#E8F5F2" stroke="#9BCDC6" stroke-width="1.4"/>
<text x="450" y="555.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">7  Explicit confirmation</text>
<text x="450" y="586.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Confirm UI or deliberate reply</text>
<text x="450" y="612.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Recheck access + proposal state</text>
<text x="450" y="638.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Bind to current review context</text>
<rect x="60" y="520" width="310" height="160" rx="12" fill="#E8F5F2" stroke="#9BCDC6" stroke-width="1.4"/>
<text x="80" y="555.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">8  Atomic care-record write</text>
<text x="80" y="586.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Commit proposal exactly once</text>
<text x="80" y="612.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Store provenance in PostgreSQL</text>
<text x="80" y="638.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Permitted caregiver reads update</text>
<text x="60" y="187.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">Recording receipt and proposal creation do not save a confirmed care fact.</text>
<rect x="60" y="755" width="680" height="108" rx="12" fill="#FFFFFF" stroke="#C3D0DD" stroke-width="1.4"/>
<text x="80" y="790.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">Correct / cancel</text>
<text x="80" y="821.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Correction invalidates the old proposal and creates a fresh read-back.</text>
<text x="80" y="847.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Cancellation leaves the proposed care fact unsaved.</text>
<rect x="800" y="755" width="680" height="108" rx="12" fill="#FFFFFF" stroke="#C3D0DD" stroke-width="1.4"/>
<text x="820" y="790.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">Durable delivery + recovery</text>
<text x="820" y="821.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Authenticated audio / events; WSS where used, HTTPS polling for recovery.</text>
<text x="820" y="847.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677D">Reminders track playback separately from reported medication status.</text>
<text x="60" y="920.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172D44">30 Sep 2026 · Repository implementation flow. Provider access, physical operation and production deployment need separate validation.</text>
</svg>